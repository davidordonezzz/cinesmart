spring.application.name=cinesmart

# Base de datos MySQL (Aiven)
# En Render se pueden usar las variables DB_HOST, DB_PORT, etc. Si no existen, usa Aiven por defecto.
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-28a3a4db-cinesmart.i.aivencloud.com}:${DB_PORT:14587}/${DB_NAME:defaultdb}?sslMode=REQUIRED&serverTimezone=Europe/Madrid
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASS}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false

# Server (Render inyecta PORT automáticamente, usamos 8080 por defecto en local)
server.port=${PORT:8080}