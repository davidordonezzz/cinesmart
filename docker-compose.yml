version: '3.8'

services:
  mysql: #la base de datos que usare
    image: mysql:8.0
    container_name: cinesmart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: usuario
      MYSQL_DATABASE: cinesmart
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app: # Contenedor de la aplicacion Spring Boot
    build: .
    container_name: cinesmart-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASS: usuario
    depends_on: #la app debe arrancar despues de arrancar el mysql
      mysql:
        condition: service_started
    restart: on-failure # se reinicia si la app falla

volumes:
  mysql_data:
