# GitHub Actions - Integracion Continua para CineSmart
#
# Cada vez que se hace push o un pull request a la rama principal,
# GitHub levanta una maquina virtual Ubuntu, instala Java 21,
# compila el proyecto y ejecuta los 9 tests unitarios.
#
# Si los tests pasan -> commit con check verde
# Si fallan         -> commit con check rojo + email de aviso

name: CI - Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    name: Build y Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar el proyecto
        run: ./mvnw -B clean compile

      - name: Ejecutar tests unitarios (JUnit 5 + Mockito)
        run: ./mvnw -B test

      - name: Empaquetar JAR (saltando tests)
        run: ./mvnw -B package -DskipTests

      - name: Subir JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cinesmart-jar
          path: target/cinesmart-*.jar
          retention-days: 7
